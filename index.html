<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="panel-modo" content="vista">
</head>
<body>
<title>Panel de Comunicaciones FHL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">

<style>
  :root {
    --azul: #7A80A3; --verde: #8DC899; --naranja: #E28757; --verde-osc: #78AA6D;
    --ground: #FFFFFF; --surface: #FAFAFB; --surface-2: #F2F2F4; --raised: #FFFFFF;
    --line: #E3E3E8; --line-soft: #EEEEF1;
    --ink: #4D4E56; --ink-strong: #33343A; --ink-soft: #7E7F89; --ink-faint: #A6A7B0;
    --on-accent: #FFFFFF;
    --ok: #4E8C5E; --ok-bg: #EAF4EC;
    --warn: #B4762F; --warn-bg: #FBF1E3;
    --idle: #6E7080; --idle-bg: #EFEFF2;
    --shadow: 0 1px 2px rgba(40,42,55,.06), 0 8px 24px rgba(40,42,55,.08);
    --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191A1E; --surface: #202127; --surface-2: #282930; --raised: #23242A;
      --line: #383941; --line-soft: #2E2F36;
      --ink: #D2D3DA; --ink-strong: #F2F2F5; --ink-soft: #91929C; --ink-faint: #6D6E78;
      --azul: #969CBC; --verde: #9DD3A8; --naranja: #EE9868; --verde-osc: #8FBE84;
      --on-accent: #191A1E;
      --ok: #8ECBA0; --ok-bg: #24302A;
      --warn: #E0A868; --warn-bg: #332A1F;
      --idle: #9A9BA6; --idle-bg: #2A2B32;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191A1E; --surface: #202127; --surface-2: #282930; --raised: #23242A;
    --line: #383941; --line-soft: #2E2F36;
    --ink: #D2D3DA; --ink-strong: #F2F2F5; --ink-soft: #91929C; --ink-faint: #6D6E78;
    --azul: #969CBC; --verde: #9DD3A8; --naranja: #EE9868; --verde-osc: #8FBE84;
    --on-accent: #191A1E;
    --ok: #8ECBA0; --ok-bg: #24302A;
    --warn: #E0A868; --warn-bg: #332A1F;
    --idle: #9A9BA6; --idle-bg: #2A2B32;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font);
         font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--naranja); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ---------- Shell ---------- */
  .shell { display:grid; grid-template-columns:212px minmax(0,1fr); min-height:100vh; }
  .shell > * { min-width:0; }
  .side { background:var(--surface); border-right:1px solid var(--line); padding:22px 0;
          display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh; }
  .brandmark { padding:0 20px; }
  /* El logo a color no lleva tinta oscura, así que se lee igual en claro y en oscuro. */
  .brandmark img { display:block; width:100%; max-width:152px; height:auto; }
  .brandmark b { display:block; font-size:11px; font-weight:600; color:var(--ink-soft);
                 letter-spacing:.01em; margin-top:10px; }
  nav { display:flex; flex-direction:column; gap:1px; }
  nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
               background:none; border:0; padding:9px 20px; cursor:pointer; color:var(--ink-soft);
               font-weight:500; font-size:13.5px; border-left:3px solid transparent; }
  nav button:hover { color:var(--ink-strong); background:var(--surface-2); }
  nav button[aria-current="true"] { color:var(--ink-strong); font-weight:700;
               border-left-color:var(--naranja); background:var(--surface-2); }
  nav button i { width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.45; flex:none; }
  nav button[aria-current="true"] i { background:var(--naranja); opacity:1; }
  .side footer { margin-top:auto; padding:0 20px; font-size:10.5px; color:var(--ink-faint); line-height:1.5; }

  main { padding:26px 30px 80px; max-width:1220px; min-width:0; overflow-x:hidden; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
              flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:23px; font-weight:700; color:var(--ink-strong); margin:0; letter-spacing:-.02em; }
  .sub { font-size:13px; color:var(--ink-soft); margin:4px 0 0; max-width:66ch; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* ---------- Controls ---------- */
  .btn { border:1px solid var(--line); background:var(--raised); color:var(--ink-strong);
         padding:7px 13px; border-radius:var(--r); cursor:pointer; font-weight:600; font-size:13px; }
  .btn:hover { border-color:var(--azul); }
  .btn.primary { background:var(--naranja); border-color:var(--naranja); color:var(--on-accent); }
  .btn.primary:hover { opacity:.9; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink-soft); }
  .btn.ghost:hover { background:var(--surface-2); color:var(--ink-strong); }
  .btn.danger { color:#B4453C; border-color:transparent; background:transparent; }
  .btn.danger:hover { background:#B4453C14; }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  select, input[type="text"], input[type="date"], textarea {
    border:1px solid var(--line); background:var(--raised); border-radius:var(--r);
    padding:7px 9px; width:100%; }
  textarea { resize:vertical; min-height:78px; line-height:1.5; }
  label.f { display:block; margin-bottom:13px; }
  label.f > span { display:block; font-size:10.5px; font-weight:700; letter-spacing:.01em; color:var(--ink-soft); margin-bottom:5px; }

  /* ---------- Estado de guardado ---------- */
  .saver { display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600;
           padding:5px 11px; border-radius:20px; background:var(--idle-bg); color:var(--idle); }
  .saver.saving { background:var(--warn-bg); color:var(--warn); }
  .saver.saved  { background:var(--ok-bg);   color:var(--ok); }
  .saver.problem{ background:var(--warn-bg); color:var(--warn); }
  .saver b { width:6px; height:6px; border-radius:50%; background:currentColor; }

  .banner { margin:16px 0 0; padding:12px 15px; border-radius:var(--r); font-size:13px;
            background:var(--warn-bg); color:var(--warn); border-left:3px solid currentColor; }
  .banner strong { font-weight:700; }

  /* ---------- Pilar chips ---------- */
  .pill { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.01em; padding:3px 7px; border-radius:2px; color:#FFF; white-space:nowrap; }
  .pill.prensa{background:#7A80A3}.pill.institucional{background:#E28757}
  .pill.avances{background:#78AA6D}
  .pill.sin{background:transparent;color:var(--ink-faint);border:1px dashed var(--line)}

  .estado { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; border:1px solid transparent; }
  .e-pendiente{background:var(--idle-bg);color:var(--idle)}
  .e-diseno{background:var(--warn-bg);color:var(--warn)}
  .e-revision{background:var(--warn-bg);color:var(--warn)}
  .e-aprobado{background:var(--ok-bg);color:var(--ok)}
  .e-programado{background:var(--ok-bg);color:var(--ok)}
  .e-publicado{background:var(--ok-bg);color:var(--ok)}

  /* ---------- Barra de progreso ---------- */
  .progress { margin:20px 0 8px; }
  .progress .track { display:flex; height:7px; border-radius:20px; overflow:hidden; background:var(--surface-2); }
  .progress .track i { display:block; }
  .progress .keys { display:flex; gap:16px; flex-wrap:wrap; margin-top:9px; font-size:11.5px; color:var(--ink-soft); }
  .progress .keys span { display:flex; align-items:center; gap:6px; }
  .progress .keys em { width:8px; height:8px; border-radius:2px; font-style:normal; }

  /* ---------- Tabla de grilla ---------- */
  .tablewrap { overflow-x:auto; margin-top:18px; border:1px solid var(--line); border-radius:var(--r); background:var(--raised); }
  table.grid { width:100%; border-collapse:collapse; min-width:900px; }
  table.grid th { text-align:left; font-size:10px; font-weight:700; letter-spacing:.01em; color:var(--ink-soft); padding:11px 13px;
                  border-bottom:1px solid var(--line); background:var(--surface); white-space:nowrap; }
  table.grid td { padding:12px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  table.grid tr:last-child td { border-bottom:0; }
  table.grid tbody tr { cursor:pointer; }
  table.grid tbody tr:hover td { background:var(--surface); }
  .c-fecha { font-weight:700; color:var(--ink-strong); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .c-fecha em { display:block; font-style:normal; font-weight:500; font-size:10.5px;
                color:var(--ink-soft); letter-spacing:.01em; }
  .c-tit { font-weight:600; color:var(--ink-strong); }
  .c-tit small { display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .warnflag { color:var(--warn); font-weight:700; font-size:11px; }

  .empty { padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px; }

  /* ---------- Alternador lista / calendario ---------- */
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--raised); }
  .segmented button { border:0; background:none; padding:7px 13px; cursor:pointer; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .segmented button + button { border-left:1px solid var(--line); }
  .segmented button:hover { color:var(--ink-strong); }
  .segmented button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink-strong); }

  /* ---------- Dias de publicacion ---------- */
  .dow.alterno { color:var(--warn); }
  .dow.excepcion { color:#B4453C; font-weight:700; }
  .hint { display:block; margin-top:5px; font-size:11px; font-weight:600; }
  .hint.habitual { color:var(--ok); }
  .hint.alterno { color:var(--warn); }
  .hint.excepcion { color:#B4453C; }
  .banner .btn { margin-left:8px; vertical-align:baseline; }

  /* ---------- Arrastre ---------- */
  .grab { cursor:grab; color:var(--ink-faint); font-size:13px; line-height:1; user-select:none; }
  table.grid tbody tr:hover .grab { color:var(--ink-soft); }
  tr.arrastrando, .cal-post.arrastrando { opacity:.35; }
  table.grid tbody tr.sobre-antes td { box-shadow:inset 0 2px 0 var(--naranja); }
  table.grid tbody tr.sobre-despues td { box-shadow:inset 0 -2px 0 var(--naranja); }
  .c-grab { width:26px; padding-right:0 !important; text-align:center; }

  /* ---------- Calendario ---------- */
  .calwrap { overflow-x:auto; margin-top:18px; }
  .cal { border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--raised); min-width:760px; }
  .cal-head, .cal-body { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .cal-head { background:var(--surface); border-bottom:1px solid var(--line); }
  .cal-head div { padding:9px 10px; font-size:10px; font-weight:700; letter-spacing:.01em; color:var(--ink-strong); }
  .cal-head div.alterno { color:var(--ink-soft); }
  .cal-head div.excepcion { color:var(--ink-faint); }
  .cal-cell { min-height:116px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
              padding:6px 6px 8px; display:flex; flex-direction:column; gap:4px; }
  .cal-cell:nth-child(7n) { border-right:0; }
  .cal-cell[data-fecha] { cursor:copy; }
  .cal-cell.vacia { background:var(--surface); }
  .cal-cell.alterno { background:var(--surface); }
  .cal-cell.excepcion { background:var(--surface-2); }
  .cal-cell.suelta { outline:2px solid var(--naranja); outline-offset:-2px; background:var(--warn-bg); }
  .cal-num { font-size:11.5px; font-weight:700; color:var(--ink-strong); font-variant-numeric:tabular-nums;
             display:flex; align-items:center; gap:5px; }
  .cal-cell.alterno .cal-num { color:var(--ink-soft); }
  .cal-cell.excepcion .cal-num { color:var(--ink-faint); }
  .cal-num u { text-decoration:none; font-weight:700; font-size:9px; letter-spacing:.02em;
               color:var(--warn); text-transform:uppercase; }
  .cal-cell.excepcion .cal-num u { color:#B4453C; }
  .cal-num b { margin-left:auto; font-weight:700; font-size:9.5px; color:var(--on-accent);
               background:var(--naranja); border-radius:20px; padding:1px 6px; }
  .cal-post { border:1px solid var(--line); border-left:3px solid var(--azul); border-radius:2px;
              background:var(--raised); padding:5px 6px; cursor:grab; font-size:11.5px; line-height:1.3; }
  .cal-post b { display:block; font-weight:600; color:var(--ink-strong); }
  .cal-post small { display:block; color:var(--ink-soft); font-size:10px; margin-top:1px; }
  .cal-post:hover { border-color:var(--azul); }
  .cal-post.intercambia { outline:2px solid var(--naranja); outline-offset:1px; }
  .callegend { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--ink-soft); }
  .callegend span { display:flex; align-items:center; gap:6px; }
  .callegend em { width:9px; height:9px; border-radius:2px; font-style:normal; border:1px solid var(--line); }
  .callegend em.habitual { background:var(--raised); }
  .callegend em.alterno { background:var(--surface); }
  .callegend em.excepcion { background:var(--surface-2); }


  /* ---------- Drawer ---------- */
  .scrim { position:fixed; inset:0; background:rgba(25,26,30,.42); z-index:40; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(520px,94vw); background:var(--ground);
            border-left:1px solid var(--line); z-index:41; display:flex; flex-direction:column;
            box-shadow:var(--shadow); }
  .drawer header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
                   justify-content:space-between; align-items:center; gap:12px; }
  .drawer header h2 { margin:0; font-size:15px; font-weight:700; color:var(--ink-strong); }
  .drawer .body { padding:20px 22px; overflow-y:auto; flex:1; }
  .drawer .foot { padding:14px 22px; border-top:1px solid var(--line); display:flex;
                  justify-content:space-between; gap:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- Proyectos ---------- */
  .projgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; margin-top:18px; }
  .proj { border:1px solid var(--line); border-radius:var(--r); background:var(--raised);
          padding:16px 17px; display:flex; flex-direction:column; gap:10px; }
  .proj > .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .proj h3 { margin:0; font-size:14.5px; font-weight:700; color:var(--ink-strong); line-height:1.35; }
  .proj { cursor:pointer; }
  .proj:hover { border-color:var(--azul); }
  .proj .loc { font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .proj .loc.falta { color:var(--warn); font-weight:600; }
  .tareaedit { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tareaedit input[type="checkbox"] { width:auto; flex:none; }
  .tareaedit input[type="text"] { flex:1; }
  .tareaedit input[type="date"] { flex:none; width:auto; font-size:12px; padding:5px 7px; }
  .tfecha { flex:none; margin-left:auto; font-style:normal; font-size:11px; font-weight:700;
            color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tfecha.vencida { color:var(--warn); }
  .tasks li.done .tfecha { color:var(--ink-faint); font-weight:500; }
  .tasks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .tasks li { display:flex; align-items:flex-start; gap:8px; font-size:13px; padding:3px 0; }
  .tasks li input { margin-top:3px; flex:none; width:auto; }
  .tasks li.done span { text-decoration:line-through; color:var(--ink-faint); }
  .tasks li button { opacity:0; margin-left:auto; }
  .tasks li:hover button { opacity:1; }
  .addtask { display:flex; gap:6px; }
  .addtask input { flex:1; }
  .projmeta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-top:9px;
              border-top:1px solid var(--line-soft); font-size:11.5px; }
  .bar { height:5px; border-radius:20px; background:var(--surface-2); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--verde-osc); }

  a.link { color:var(--azul); font-weight:600; text-decoration:none; font-size:12px; }
  a.link:hover { text-decoration:underline; }

  /* ---------- Marca ---------- */
  .swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:16px; }
  .sw { border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--raised); }
  .sw .chip { height:74px; cursor:pointer; display:flex; align-items:flex-end; justify-content:flex-end; padding:8px; }
  .sw .chip span { font-size:10px; font-weight:700; color:#FFF; opacity:0; background:rgba(0,0,0,.25);
                   padding:2px 6px; border-radius:2px; }
  .sw .chip:hover span { opacity:1; }
  .sw .meta { padding:10px 12px; }
  .sw .meta b { display:block; font-size:12.5px; color:var(--ink-strong); }
  .sw .meta code { font-size:11px; color:var(--ink-soft); font-family:ui-monospace,monospace; }

  .specs { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px;
           background:var(--line); border:1px solid var(--line); border-radius:var(--r);
           overflow:hidden; margin-top:16px; }
  .spec { background:var(--raised); padding:16px 17px; }
  .spec b { display:block; font-size:13px; color:var(--ink-strong); margin-bottom:5px; }
  .spec code { font-size:12px; color:var(--naranja); font-weight:700; font-family:ui-monospace,monospace; }
  .spec p { margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); }

  .rulelist { margin-top:16px; border:1px solid var(--line); border-radius:var(--r); background:var(--raised); }
  .rulelist div { padding:12px 16px; border-bottom:1px solid var(--line-soft); font-size:13px; display:flex; gap:11px; }
  .rulelist div:last-child { border-bottom:0; }
  .rulelist em { font-style:normal; font-weight:700; flex:none; font-size:11px; padding:2px 7px;
                 border-radius:2px; height:fit-content; }
  .rulelist .si em { background:var(--ok-bg); color:var(--ok); }
  .rulelist .no em { background:#B4453C1a; color:#B4453C; }

  .typescale { margin-top:16px; border:1px solid var(--line); border-radius:var(--r); background:var(--raised); overflow:hidden; }
  .typescale div { padding:13px 16px; border-bottom:1px solid var(--line-soft); display:flex;
                   align-items:baseline; gap:16px; }
  .typescale div:last-child { border-bottom:0; }
  .typescale b { flex:none; width:88px; font-size:10.5px; letter-spacing:.01em; color:var(--ink-soft); }
  .typescale span { color:var(--ink-strong); }
  .typescale code { margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:ui-monospace,monospace; flex:none; }

  /* ---------- Fotos ---------- */
  .folders { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; margin-top:16px; }
  .folder { display:flex; align-items:center; gap:11px; border:1px solid var(--line); border-radius:var(--r);
            background:var(--raised); padding:12px 14px; text-decoration:none; color:inherit; }
  .folder:hover { border-color:var(--azul); background:var(--surface); }
  .folder b { font-size:13px; font-weight:600; color:var(--ink-strong); display:block; line-height:1.3; }
  .folder small { font-size:10.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .folder .ic { width:26px; height:22px; border-radius:2px 2px 3px 3px; background:var(--azul);
                opacity:.85; flex:none; position:relative; }
  .folder .ic::before { content:""; position:absolute; top:-4px; left:0; width:11px; height:4px;
                        border-radius:2px 2px 0 0; background:var(--azul); }
  .searchbar { margin-top:16px; max-width:320px; }

  /* ---------- Descargas ---------- */
  .h2sec { font-size:12px; letter-spacing:.01em; color:var(--ink-strong); margin:30px 0 0;
           display:flex; align-items:baseline; gap:10px; }
  .descargas { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; margin-top:14px; }
  .desc { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:var(--r);
          background:var(--raised); padding:11px 13px; text-decoration:none; color:inherit; }
  .desc:hover { border-color:var(--azul); background:var(--surface); }
  .desc b { display:block; font-size:13px; font-weight:600; color:var(--ink-strong); line-height:1.3; }

        '<td class="c-tit">' + esc(p.titular || "(sin título)") +
          (tieneCorchetes(p) ? ' <span class="warnflag">· falta completar</span>' : "") +
          "<small>" + esc((p.copy || "").slice(0, 96)) + ((p.copy || "").length > 96 ? "…" : "") + "</small></td>" +
        '<td><span class="estado ' + (EST_CLASS[p.estado] || "e-pendiente") + '">' + esc(p.estado) + "</span></td>" +
        "</tr>";
    }).join("");

    if (!lista.length) {
      return '<div class="tablewrap"><div class="empty">Sin publicaciones en ' +
        esc(mesLabel(mesActivo)) + ".</div></div>";
    }
    return '<div class="tablewrap"><table class="grid"><thead><tr>' +
      "<th></th><th>Día</th><th>Pilar</th><th>Publicación</th><th>Estado</th>" +
      "</tr></thead><tbody>" + filas + "</tbody></table></div>";
  }

  // Calendario mensual, con la semana empezando en lunes.
  function vistaCalendario(lista) {
    var pk = mesActivo.split("-"), anio = +pk[0], mes = +pk[1] - 1;
    var offset = (new Date(anio, mes, 1).getDay() + 6) % 7;   // lunes = 0
    var dias = new Date(anio, mes + 1, 0).getDate();
    var celdas = Math.ceil((offset + dias) / 7) * 7;
    var hoy = isoDe(new Date());

    var porFecha = {};
    lista.forEach(function (p) { (porFecha[p.fecha] = porFecha[p.fecha] || []).push(p); });

    var cab = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(function (d, i) {
      return '<div class="' + DIA_TIPO[(i + 1) % 7] + '">' + d + "</div>";
    }).join("");

    var cuerpo = "";
    for (var i = 0; i < celdas; i++) {
      var n = i - offset + 1;
      if (n < 1 || n > dias) { cuerpo += '<div class="cal-cell vacia"></div>'; continue; }
      var f = isoDe(new Date(anio, mes, n));
      var t = DIA_TIPO[new Date(anio, mes, n).getDay()];
      var chips = (porFecha[f] || []).map(function (p) {
        var pil = pilarDe(p);
        return '<div class="cal-post" data-cid="' + esc(p.id) + '"' +
          (soloLectura ? "" : ' draggable="true"') +
          ' style="border-left-color:' + pil.hex + '" title="' + esc(p.titular || "(sin título)") + '">' +
          "<b>" + esc(p.titular || "(sin título)") + "</b></div>";
      }).join("");
      cuerpo += '<div class="cal-cell ' + t + '" data-fecha="' + f + '">' +
        '<div class="cal-num">' + n +
          (t === "excepcion" ? "<u>excep.</u>" : "") +
          (f === hoy ? "<b>hoy</b>" : "") +
        "</div>" + chips + "</div>";
    }

    return '<div class="calwrap"><div class="cal">' +
      '<div class="cal-head">' + cab + "</div>" +
      '<div class="cal-body">' + cuerpo + "</div></div></div>" +
      '<div class="callegend">' +
        '<span><em class="habitual"></em>lun · mié · vie</span>' +
        '<span><em class="alterno"></em>mar · jue</span>' +
        '<span><em class="excepcion"></em>fin de semana</span>' +
      "</div>";
  }

  function vistaProyectos() {
    var lista = mesas().filter(function (f) {
      if (!pasaZona(f.zona, filtroZona)) return false;
      if (soloActivos && !f.activo) return false;
      return true;
    });

    var conteo = {};
    AMBITOS.forEach(function (z) { conteo[z] = 0; });
    mesas().forEach(function (f) { if (conteo[f.zona] != null) conteo[f.zona]++; });
    var prioritarias = mesas().filter(function (f) { return f.activo; }).length;

    // Un grupo por ámbito: primero las cuatro zonas, y al final lo nacional.
    var grupos = AMBITOS.map(function (z) {
      return { zona:z, items:lista.filter(function (f) { return f.zona === z; }) };
    }).filter(function (g) { return g.items.length; });

    var cuerpo = grupos.map(function (g) {
      var esNac = g.zona === NACIONAL;
      // Las prioritarias suben al principio de su grupo.
      var items = g.items.slice().sort(function (a, b) {
        return (b.activo ? 1 : 0) - (a.activo ? 1 : 0);
      });
      return '<section class="grupo"><div class="grupohead"><h2>' +
        '<i style="background:' + ZONA_HEX[g.zona] + '"></i>' +
        (esNac ? "Nacional · áreas de trabajo" : "Zona " + g.zona) + "</h2>" +
        '</div><div class="projgrid">' + items.map(tarjetaMesa).join("") + "</div></section>";
    }).join("");

    return '<div class="pagehead"><div><h1>Tareas</h1>' +
      "</div>" +
      '<div class="toolbar">' + (MODO === "vista" ? "" : '<div id="saver" class="saver"><b></b>Conectando…</div>') +
      (soloLectura ? "" : '<button class="btn" id="btnArea">+ Área</button>' +
                          '<button class="btn primary" id="btnProy">+ Comuna</button>') + "</div></div>" +
      '<div class="chips" id="chipsProy">' + chipsZona(filtroZona, conteo, 0, AMBITOS) +
        '<button class="btn activos" id="btnActivos" aria-pressed="' + (!!soloActivos) + '"' +
        ' title="Mostrar solo las tarjetas fijadas con estrella">★ Prioritarias' +
        (prioritarias ? " (" + prioritarias + ")" : "") + "</button></div>" +
      (grupos.length ? cuerpo
        : '<div class="tablewrap"><div class="empty">Nada con ese filtro.</div></div>');
  }

  function tarjetaMesa(f) {
    var hechas = f.tareas.filter(function (t) { return t.hecha; }).length;
    var pct = f.tareas.length ? Math.round(hechas / f.tareas.length * 100) : 0;
    var esArea = f.tipo === "area";
    var carpeta = esArea ? null : carpetaDeComuna(f.nombre);
    var tareas = f.tareas.map(function (t) {
      return '<li class="' + (t.hecha ? "done" : "") + '">' +
        '<input type="checkbox" data-task="' + esc(f.id) + "|" + esc(t.id) + '"' + (t.hecha ? " checked" : "") + (soloLectura ? " disabled" : "") + ">" +
        "<span>" + esc(t.texto) + "</span>" +
        (t.fecha ? '<em class="tfecha' + (estaVencida(t) ? " vencida" : "") + '">' + fechaCorta(t.fecha) + "</em>" : "") +
        (soloLectura ? "" : '<button class="btn ghost danger" data-deltask="' + esc(f.id) + "|" + esc(t.id) + '" title="Eliminar tarea">×</button>') +
        "</li>";
    }).join("");
    return '<div class="proj' + (f.activo ? " activo" : "") + '" data-proj="' + esc(f.id) + '">' +
      '<div class="top"><div><h3>' + esc(f.nombre) + "</h3>" +
        '<div class="projtags">' +
          '<span class="zona"><i style="background:' + ZONA_HEX[f.zona] + '"></i>' +
          esc(esArea ? "Área · nacional" : f.zona) + "</span>" +
        "</div></div>" +
        '<div style="display:flex;align-items:center;gap:6px">' +
        (soloLectura ? "" : '<button class="star" data-activo="' + esc(f.id) + '" aria-pressed="' + (!!f.activo) +
          '" title="' + (f.activo ? "Quitar de arriba" : "Fijar arriba del grupo") + '">' + (f.activo ? "★" : "☆") + "</button>") +
        "</div></div>" +
      (f.tareas.length ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : "") +
      (tareas ? '<ul class="tasks">' + tareas + "</ul>" : '<div style="font-size:12.5px;color:var(--ink-faint)">Sin tareas todavía.</div>') +
      (soloLectura ? "" : '<div class="addtask"><input type="text" placeholder="Nueva tarea…" data-newtask="' + esc(f.id) + '"><button class="btn" data-addtask="' + esc(f.id) + '">Añadir</button></div>') +
      '<div class="projmeta">' +
        '<span style="color:var(--ink-soft)">' + hechas + "/" + f.tareas.length + " tareas</span>" +
        (carpeta ? '<a class="link" target="_blank" rel="noopener" href="https://drive.google.com/drive/folders/' + esc(carpeta[2]) + '">Fotos ↗</a>' : "") +
        (soloLectura ? "" : '<button class="btn ghost" data-editproj="' + esc(f.id) + '" style="margin-left:auto">Editar</button>') +
      "</div></div>";
  }

  function vistaFotos() {
    var q = filtroFoto.trim().toLowerCase();
    var conteo = {};
    ZONAS.forEach(function (z) { conteo[z] = 0; });
    var sinZona = 0;

    var lista = CARPETAS.filter(function (c) {
      if (q && c[1].toLowerCase().indexOf(q) < 0) return false;
      return pasaZona(zonaDeComuna(c[1]), filtroZonaFoto);
    });

    var items = lista.map(function (c) {
      var z = zonaDeComuna(c[1]);
      return '<a class="folder" target="_blank" rel="noopener" href="https://drive.google.com/drive/folders/' + esc(c[2]) + '">' +
        '<span class="ic"' + (z ? ' style="background:' + ZONA_HEX[z] + '"' : "") + "></span>" +
        "<span><b>" + esc(c[1]) + "</b><small>" + (z || "Sin zona") + " · carpeta " + esc(c[0]) + "</small></span></a>";
    }).join("");

    return '<div class="pagehead"><div><h1>Fotos por comuna</h1>' +
      "</div>" +
      '<div class="toolbar"><a class="btn" target="_blank" rel="noopener" href="' + DRIVE_RAIZ + '">Abrir carpeta raíz ↗</a>' +
      '<a class="btn" target="_blank" rel="noopener" href="' + DRIVE_PROY + '">Proyectos ejecutados ↗</a></div></div>' +
      '<div class="chips" id="chipsFoto">' + chipsZona(filtroZonaFoto, conteo, sinZona) + "</div>" +
      '<div class="searchbar"><input type="text" id="buscaFoto" placeholder="Buscar comuna…" value="' + esc(filtroFoto) + '"></div>' +
      (items ? '<div class="folders">' + items + "</div>"

            '<small class="hint ' + tipoDia(p.fecha) + '">' + esc(nombreDia(p.fecha)) + "</small></label>" +

        "</div>";

      '<div class="body">' +
        '<div class="row2">' +

            '<input type="text" data-p="nombre"' + (esArea ? "" : ' list="comunas-drive"') + ' value="' + esc(m.nombre) + '">' +
            (esArea ? "" : '<datalist id="comunas-drive">' + sugerencias + "</datalist>") + "</label>" +
          '<label class="f"><span>Ámbito</span><select data-p="zona"' + (esArea ? " disabled" : "") + ">" + opZona + "</select></label>" +

        '<div style="font-size:10.5px;font-weight:700;letter-spacing:.01em;color:var(--ink-soft);margin-bottom:7px">Tareas</div>' +

        '<div class="addtask" style="margin-top:10px">' +
          '<input type="text" id="nuevaTareaDrawer" placeholder="Nueva tarea…">' +

  // ---------- Render ----------
  function render() {
    var cuerpo = vista === "grilla" ? vistaGrilla()
               : vista === "proyectos" ? vistaProyectos()
               : vista === "marca" ? vistaMarca() : vistaFotos();

    var nav = [["grilla","Grilla"],["proyectos","Tareas"],["marca","Marca"],["fotos","Fotos"]]
      .map(function (n) {
        return '<button data-v="' + n[0] + '" aria-current="' + (vista === n[0] ? "true" : "false") + '"><i></i>' + n[1] + "</button>";
      }).join("");

    document.getElementById("app").innerHTML =
      '<div class="shell"><aside class="side">' +
        '<div class="brandmark"><img src="' + LOGO.color + '" alt="Fundación Huella Local"><b>Panel de Comunicaciones</b></div>' +
        "<nav>" + nav + "</nav>" +

      '</aside><main>' + cuerpo + "</main></div>" + drawer() + drawerMesa();

    pintarSaver();
    conectar();
  }

  // ---------- Eventos ----------
  function conectar() {
    var $ = function (s) { return document.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

    $$("nav button").forEach(function (b) {
      b.onclick = function () { vista = b.getAttribute("data-v"); editando = null; render(); };
    });

    if (vista === "grilla") {
      // Se comparte entre lista y calendario: id de lo que se está arrastrando y
      // un pestillo para que el clic que sigue a un arrastre no abra el editor.
      var arrastreId = null;
      var recienArrastrado = false;
      var limpiarMarcas = function () {
        $$(".sobre-antes, .sobre-despues, .intercambia, .suelta").forEach(function (x) {
          x.classList.remove("sobre-antes", "sobre-despues", "intercambia", "suelta");
        });
      };
      var trasArrastre = function () {
        limpiarMarcas();
        recienArrastrado = true;
        setTimeout(function () { recienArrastrado = false; }, 80);
      };
      var abrirPost = function (id) {
        editando = posts().filter(function (p) { return p.id === id; })[0] || null;
        render();
      };

      $$(".segmented button[data-m]").forEach(function (b) {
        b.onclick = function () { modoGrilla = b.getAttribute("data-m"); render(); };
      });

      var sel = $("#selMes");
      if (sel) sel.onchange = function () { mesActivo = sel.value; render(); };

      var bm = $("#btnMes");
      if (bm) bm.onclick = function () {
        var v = prompt("Mes nuevo, formato AAAA-MM:");
        if (!v) return;
        if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(v)) { alert("Formato inválido. Usá AAAA-MM, por ejemplo 2026-10."); return; }
        if (!state.meses[v]) state.meses[v] = {};
        mesActivo = v; marcar(); render();
      };

      var crear = function (fecha) {
        var nuevo = { id:uid(), fecha:fecha, pilar:"", titular:"", copy:"", estado:"Pendiente" };
        ponerPost(nuevo);
        editando = nuevo; marcar(); render();
      };

      var bn = $("#btnNueva");
      if (bn) bn.onclick = function () { crear(slotLibre()); };



      // ----- Lista: arrastrar una fila cambia el orden -----
      $$("table.grid tbody tr").forEach(function (tr) {
        tr.onclick = function () {
          if (recienArrastrado) return;
          abrirPost(tr.getAttribute("data-id"));
        };
        if (soloLectura) return;

        tr.ondragstart = function (e) {
          arrastreId = tr.getAttribute("data-id");
          tr.classList.add("arrastrando");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", arrastreId); } catch (x) {}
        };
        tr.ondragend = function () { tr.classList.remove("arrastrando"); trasArrastre(); };
        tr.ondragover = function (e) {
          if (!arrastreId || arrastreId === tr.getAttribute("data-id")) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          var r = tr.getBoundingClientRect();
          var despues = (e.clientY - r.top) > r.height / 2;
          limpiarMarcas();
          tr.classList.add(despues ? "sobre-despues" : "sobre-antes");
        };
        tr.ondragleave = function () { tr.classList.remove("sobre-antes", "sobre-despues"); };
        tr.ondrop = function (e) {
          e.preventDefault();
          var destino = tr.getAttribute("data-id");
          var despues = tr.classList.contains("sobre-despues");
          limpiarMarcas();
          if (!arrastreId || arrastreId === destino) return;
          reordenar(arrastreId, destino, despues);
          arrastreId = null;
          marcar(); render();
        };
      });

      // ----- Calendario: arrastrar a otro día mueve; sobre otra publicación, intercambia -----
      $$(".cal-post").forEach(function (chip) {
        chip.onclick = function (e) {
          e.stopPropagation();
          if (recienArrastrado) return;
          abrirPost(chip.getAttribute("data-cid"));
        };
        if (soloLectura) return;

        chip.ondragstart = function (e) {
          arrastreId = chip.getAttribute("data-cid");
          chip.classList.add("arrastrando");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", arrastreId); } catch (x) {}
          e.stopPropagation();
        };
        chip.ondragend = function () { chip.classList.remove("arrastrando"); trasArrastre(); };
        chip.ondragover = function (e) {
          if (!arrastreId || arrastreId === chip.getAttribute("data-cid")) return;
          e.preventDefault(); e.stopPropagation();
          e.dataTransfer.dropEffect = "move";
          chip.classList.add("intercambia");
        };
        chip.ondragleave = function () { chip.classList.remove("intercambia"); };
        chip.ondrop = function (e) {
          e.preventDefault(); e.stopPropagation();
          var destino = chip.getAttribute("data-cid");
          limpiarMarcas();
          if (!arrastreId || arrastreId === destino) return;
          intercambiarFechas(arrastreId, destino);
          arrastreId = null;
          marcar(); render();
        };
      });

      $$(".cal-cell[data-fecha]").forEach(function (cell) {
        cell.onclick = function (e) {
          if (soloLectura || recienArrastrado) return;
          if (e.target.closest(".cal-post")) return;
          crear(cell.getAttribute("data-fecha"));
        };
        if (soloLectura) return;

        cell.ondragover = function (e) {
          if (!arrastreId) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          cell.classList.add("suelta");
        };
        cell.ondragleave = function () { cell.classList.remove("suelta"); };
        cell.ondrop = function (e) {
          e.preventDefault();
          cell.classList.remove("suelta");
          if (!arrastreId) return;
          moverAFecha(arrastreId, cell.getAttribute("data-fecha"));
          arrastreId = null;
          marcar(); render();
        };
      });
    }

    if (vista === "proyectos") {
      $$("#chipsProy button[data-z]").forEach(function (b) {
        b.onclick = function () { filtroZona = b.getAttribute("data-z"); render(); };
      });
      var ba = $("#btnActivos");
      if (ba) ba.onclick = function () { soloActivos = !soloActivos; render(); };
      $$("[data-activo]").forEach(function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          var id = b.getAttribute("data-activo");
          mesas().forEach(function (m) { if (m.id === id) m.activo = !m.activo; });
          marcar(); render();
        };
      });

      var crearFicha = function (nombre, tipo) {
        var zona = tipo === "area" ? NACIONAL : (COMUNA_ZONA[sinAcentos(nombre)] || "Norte");
        var nueva = { id:uid(), nombre:nombre, zona:zona, tipo:tipo, tareas:[], activo:false };
        ponerMesa(nueva);
        editandoProy = nueva;
        marcar(); render();
      };

      var bp = $("#btnProy");
      if (bp) bp.onclick = function () {
        var n = prompt("Comuna nueva:");
        if (n) crearFicha(n, "comuna");
      };
      var bar = $("#btnArea");
      if (bar) bar.onclick = function () {
        var n = prompt("Área nueva:");
        if (n) crearFicha(n, "area");
      };

      $$("[data-task]").forEach(function (cb) {
        cb.onchange = function () {
          var parts = cb.getAttribute("data-task").split("|");
          mesas().forEach(function (m) {
            if (m.id !== parts[0]) return;
            m.tareas.forEach(function (t) { if (t.id === parts[1]) t.hecha = cb.checked; });
          });
          marcar(); render();
        };
      });
      $$("[data-deltask]").forEach(function (b) {
        b.onclick = function () {
          var parts = b.getAttribute("data-deltask").split("|");
          mesas().forEach(function (m) {
            if (m.id !== parts[0]) return;
            m.tareas = m.tareas.filter(function (t) { return t.id !== parts[1]; });
          });
          marcar(); render();
        };
      });
      $$("[data-addtask]").forEach(function (b) {
        var id = b.getAttribute("data-addtask");
        var inp = document.querySelector('[data-newtask="' + id + '"]');
        var añadir = function () {
          var v = inp.value.trim();
          if (!v) return;
          mesas().forEach(function (m) {
            if (m.id === id) m.tareas.push({ id:uid(), texto:v, fecha:"", hecha:false });
          });
          marcar(); render();
        };
        b.onclick = añadir;
        if (inp) inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); añadir(); } };
      });

      var abrirMesa = function (id) {
        editandoProy = mesas().filter(function (x) { return x.id === id; })[0] || null;
        render();
      };
      $$("[data-editproj]").forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); abrirMesa(b.getAttribute("data-editproj")); };
      });
      $$(".proj[data-proj]").forEach(function (card) {
        card.onclick = function (e) {
          if (soloLectura) return;
          if (e.target.closest("input, button, a, label")) return;
          abrirMesa(card.getAttribute("data-proj"));
        };
      });
    }

    if (vista === "marca") {
      $$("[data-hex]").forEach(function (c) {
        c.onclick = function () {
          var hex = c.getAttribute("data-hex");
          if (navigator.clipboard) navigator.clipboard.writeText(hex);
          var s = c.querySelector("span");
          if (s) { s.textContent = "copiado"; s.style.opacity = "1";
                   setTimeout(function () { s.textContent = "copiar"; s.style.opacity = ""; }, 1200); }
        };
      });
    }

    if (vista === "fotos") {
      $$("#chipsFoto button[data-z]").forEach(function (b) {
        b.onclick = function () { filtroZonaFoto = b.getAttribute("data-z"); render(); };
      });
      var bf = $("#buscaFoto");
      if (bf) bf.oninput = function () {
        filtroFoto = bf.value;
        var pos = bf.selectionStart;
        render();
        var nb = document.getElementById("buscaFoto");
        if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (e) {} }
      };
    }

    if (editando) {
      // En modo vista la ficha se abre igual —conviene leer el copy completo—
      // pero con todo desactivado.
      if (soloLectura) $$("[data-f]").forEach(function (f) { f.disabled = true; });
      $$("[data-f]").forEach(function (f) {
        var campo = f.getAttribute("data-f");
        var ev = (f.tagName === "SELECT" || f.type === "date") ? "change" : "input";
        f.addEventListener(ev, function () {
          editando[campo] = f.value;
          marcar();
          if (ev === "change") render();
        });
      });
      // Si se creó una publicación y se cerró sin escribir nada, se descarta.
      // Evita que "+ Publicación" deje filas vacías por un clic accidental.
      var cerrar = function () {
        var p = editando;
        if (p && !(p.titular || "").trim() && !(p.copy || "").trim()) {
          quitarPost(p.id);
          editando = null; marcar(); render();
          return;
        }
        editando = null; render();
      };
      if ($("#cerrar")) $("#cerrar").onclick = cerrar;
      if ($("#listo")) $("#listo").onclick = cerrar;
      if ($("#scrim")) $("#scrim").onclick = cerrar;
      if ($("#borrar")) $("#borrar").onclick = function () {
        if (!confirm("¿Eliminar esta publicación de la grilla?")) return;
        quitarPost(editando.id);
        editando = null; marcar(); render();
      };
    }

    if (editandoProy) {
      var m = editandoProy;

      $$("[data-p]").forEach(function (f) {
        var campo = f.getAttribute("data-p");
        var ev = f.tagName === "SELECT" ? "change" : "input";
        f.addEventListener(ev, function () {
          m[campo] = f.value;
          marcar();
          if (ev === "change") render();
        });
      });

      $$("[data-ttexto]").forEach(function (f) {
        f.addEventListener("input", function () {
          var id = f.getAttribute("data-ttexto");
          m.tareas.forEach(function (t) { if (t.id === id) t.texto = f.value; });
          marcar();
        });
      });
      $$("[data-tfecha]").forEach(function (f) {
        f.addEventListener("change", function () {
          var id = f.getAttribute("data-tfecha");
          m.tareas.forEach(function (t) { if (t.id === id) t.fecha = f.value; });
          marcar(); render();
        });
      });
      $$("[data-thecha]").forEach(function (c) {
        c.onchange = function () {
          var id = c.getAttribute("data-thecha");
          m.tareas.forEach(function (t) { if (t.id === id) t.hecha = c.checked; });
          marcar(); render();
        };
      });
      $$("[data-tborrar]").forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute("data-tborrar");
          m.tareas = m.tareas.filter(function (t) { return t.id !== id; });
          marcar(); render();
        };
      });

      var añadirEnDrawer = function () {
        var inp = $("#nuevaTareaDrawer");
        var v = inp.value.trim();
        if (!v) return;
        m.tareas.push({ id: uid(), texto: v, fecha: "", hecha: false });
        marcar(); render();
      };
      if ($("#addTareaDrawer")) $("#addTareaDrawer").onclick = añadirEnDrawer;
      if ($("#nuevaTareaDrawer")) $("#nuevaTareaDrawer").onkeydown = function (e) {
        if (e.key === "Enter") { e.preventDefault(); añadirEnDrawer(); }
      };

      var cerrarProy = function () { editandoProy = null; render(); };
      if ($("#cerrarProy")) $("#cerrarProy").onclick = cerrarProy;
      if ($("#listoProy")) $("#listoProy").onclick = cerrarProy;
      if ($("#scrimProy")) $("#scrimProy").onclick = cerrarProy;
      if ($("#borrarProy")) $("#borrarProy").onclick = function () {
        if (!confirm("¿Eliminar “" + m.nombre + "” y sus tareas?")) return;
        quitarMesa(m.id);
        editandoProy = null; marcar(); render();
      };
    }
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (editandoProy) { editandoProy = null; render(); return; }
    if (editando) { editando = null; render(); }
  });

  render();
})();
</script>

</body>
</html>
